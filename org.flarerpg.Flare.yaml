app-id: org.flarerpg.Flare
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: flare.sh
rename-desktop-file: flare.desktop
rename-icon: flare_logo
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
cleanup:
  - /app/games
  - /app/share/man
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_ttf.json

  - name: flare-engine
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.10
    post-install:
      - mkdir /app/bin
      - mv /app/games/flare /app/bin
      - install -Dm644 distribution/flare_logo.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: archive
        url: https://github.com/flareteam/flare-engine/archive/v1.15.tar.gz
        sha256: 642db16111487bf8a3fb7ebadcfc635909c7eaf91df7723ee22fae1caac9fe93
        x-checker-data:
          type: anitya
          project-id: 21433
          url-template: https://github.com/flareteam/flare-engine/archive/v$version.tar.gz
          stable-only: true

  - name: flare-game
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.10
    post-install:
      - install -Dm755 flare.sh -t /app/bin/
      - desktop-file-edit --set-key=Exec --set-value=flare.sh /app/share/applications/flare.desktop
    sources:
      - type: archive
        url: https://github.com/flareteam/flare-game/archive/v1.15.tar.gz
        sha256: b6b2e7037dae416c29d2d55f8275491ed9edec690194fc2165a5429582a2518c
        x-checker-data:
          type: anitya
          project-id: 21434
          url-template: https://github.com/flareteam/flare-game/archive/v$version.tar.gz
          stable-only: true
      - type: script
        dest-filename: flare.sh
        commands:
          - flare --data-path=/app/share/games/flare
